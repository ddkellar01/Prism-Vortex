apiVersion: v1
kind: Secret
metadata:
  name: prism-vortex-secrets
type: Opaque
stringData:
  GEMINI_API_KEY: "YOUR_ACTUAL_GEMINI_API_KEY_HERE"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prism-vortex-deployment
  labels:
    app: prism-vortex
spec:
  replicas: 3
  selector:
    matchLabels:
      app: prism-vortex
  template:
    metadata:
      labels:
        app: prism-vortex
    spec:
      containers:
      - name: prism-vortex
        image: prism-vortex:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: prism-vortex-secrets
              key: GEMINI_API_KEY
        - name: ENVIRONMENT
          value: "production"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: prism-vortex-service
spec:
  type: ClusterIP
  selector:
    app: prism-vortex
  ports:
  - port: 80
    targetPort: 8080
