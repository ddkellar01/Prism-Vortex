name: PrismVortex Security & Vulnerability Audit

on:
  schedule:
    - cron: '0 0 * * 1' # Every Monday at midnight
  push:
    branches: [ main ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Static Application Security Testing (SAST)
        run: |
          bandit -r . -ll -ii

      # Safety CLI now requires an interactive account login before it will
      # scan (`safety scan` prompts for registration and dies with
      # "EOF when reading a line" on CI runners). pip-audit is the free,
      # non-interactive replacement: it audits the project's installed
      # dependencies against the PyPI Advisory Database / OSV.
      # The venv's bundled pip/setuptools are upgraded first so pip-audit
      # does not fail the job on the venv seed packages themselves.
      - name: Scan Python Dependencies for Known Vulnerabilities
        run: |
          python -m venv audit-env
          ./audit-env/bin/pip install --upgrade pip setuptools
          ./audit-env/bin/pip install . pip-audit
          ./audit-env/bin/pip-audit
